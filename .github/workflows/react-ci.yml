name: React checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agromarket-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agromarket-react

      - name: Lint React application
        run: npm run lint
        working-directory: agromarket-react

      - name: Build React application
        run: npm run build
        working-directory: agromarket-react
