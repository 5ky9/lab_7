name: API tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agromarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agromarket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agromarket_test
      JWT_SECRET: agromarket-lab8-ci-secret-never-use-outside-tests
      JWT_EXPIRES_IN: 2h
      TEST_ADMIN_EMAIL: admin@test.kz
      TEST_ADMIN_PASSWORD: TestAdminPassword123!
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agromarket-server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agromarket-server

      - name: Run API integration and unit tests
        run: npm test
        working-directory: agromarket-server

      - name: Build React app
        run: |
          npm ci
          npm run build
        working-directory: agromarket-react
