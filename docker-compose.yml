services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agromarket
      POSTGRES_USER: agromarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agromarket_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agromarket-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agromarket -d agromarket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agromarket-db:
